<section class="section-md bg-default text-center">
    <div class="container">
        <h4 class="heading-decorated">{{ settings.heading }}</h4>
        <div class="row row-50">
            {% for m in settings.members %}
            <div class="col-md-6 col-lg-4">
                <article class="thumb-flat">
                    <img class="thumb-flat__image" src="{{ asset(m.image) }}" alt="{{ m.name }}">
                    <div class="thumb-flat__body">
                        <p class="heading-6">{{ m.name }}</p>
                        <p class="thumb-flat__subtitle">{{ m.role }}</p>
                        <p>{{ m.text }}</p>
                    </div>
                </article>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
