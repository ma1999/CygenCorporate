<section class="section-md bg-accent text-center">
    <div class="container">
        <div class="row justify-content-md-center row-50">
            {% for e in settings.entries %}
            <div class="col-md-6 col-lg-3">
                <article class="box-counter">
                    <div class="box-counter__icon {{ e.icon_class }}"></div>
                    <div class="box-counter__wrap"><div class="counter">{{ e.number }}</div></div>
                    <p class="box-counter__title">{{ e.label }}</p>
                </article>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
