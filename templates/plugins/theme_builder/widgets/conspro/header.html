<!-- Main Header-->
<header class="main-header">
    <div class="header-upper">
        <div class="auto-container">
            <div class="clearfix">
                <div class="pull-left logo-outer">
                    <div class="logo"><a href="/"><img src="{{ asset(settings.logo) }}" alt=""></a></div>
                </div>
                <div class="pull-right upper-right clearfix">
                    <div class="info-box">
                        <div class="inner-box">
                            <div class="icon-box"><span class="flaticon-technology"></span></div>
                            <ul>
                                <li>با ما تماس بگیرید</li>
                                <li><strong class="ltr-text">{{ settings.phone }}</strong></li>
                            </ul>
                        </div>
                    </div>
                    <div class="info-box">
                        <div class="inner-box">
                            <div class="icon-box"><span class="flaticon-location-pin"></span></div>
                            <ul>
                                <li>ایمیل</li>
                                <li><strong>{{ settings.email }}</strong></li>
                            </ul>
                        </div>
                    </div>
                    <div class="info-box">
                        <div class="quote-btn"><a href="{{ settings.cta_url }}" class="get-quote-btn theme-btn">{{ settings.cta_text }}</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="header-lower">
        <div class="auto-container">
            <div class="outer-box">
                <div class="nav-outer clearfix">
                    <nav class="main-menu">
                        <div class="navbar-header clearfix">
                            <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                                <span class="icon-bar"></span><span class="icon-bar"></span><span class="icon-bar"></span>
                            </button>
                        </div>
                        <div class="navbar-collapse collapse clearfix">
                            <ul class="navigation clearfix">
                                {% for item in settings.menu %}
                                <li><a href="{{ item.url }}">{{ item.label }}</a></li>
                                {% endfor %}
                            </ul>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </div>
    <div class="sticky-header">
        <div class="auto-container clearfix">
            <div class="logo pull-left">
                <a href="/" class="img-responsive"><img src="{{ asset(settings.logo) }}" alt=""></a>
            </div>
            <div class="right-col pull-right">
                <nav class="main-menu">
                    <div class="navbar-collapse collapse clearfix">
                        <ul class="navigation clearfix">
                            {% for item in settings.menu %}
                            <li><a href="{{ item.url }}">{{ item.label }}</a></li>
                            {% endfor %}
                        </ul>
                    </div>
                </nav>
            </div>
        </div>
    </div>
</header>
<!--End Main Header -->
