<!--News Section-->
<section class="news-section">
    <div class="auto-container">
        <div class="sec-title">
            <h2>{{ settings.heading }}</h2>
        </div>
        <div class="news-outer owl-carousel owl-theme">
            {% for item in settings.entries %}
            <div class="news-block">
                <div class="inner-box">
                    <div class="image">
                        <a href="{{ item.url }}"><img src="{{ asset(item.image) }}" alt=""></a>
                    </div>
                    <div class="lower-content">
                        <div class="post-date">ارسال شده در {{ item.date }}</div>
                        <h3><a href="{{ item.url }}">{{ item.title }}</a></h3>
                        <div class="text">{{ item.text }}</div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
<script>
(function(){
    if (window.jQuery) {
        jQuery(function($){
            $('.news-outer').owlCarousel({ items: 3, loop: true, margin: 30, rtl: true, nav: true, dots: true });
        });
    }
})();
</script>
<!--End News Section-->
