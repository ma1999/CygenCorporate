<!--FullWidth Section-->
<section class="fullwidth-section">
    <div class="outer-section clearfix">
        <div class="content-column">
            <div class="content-inner">
                <h2>{{ settings.heading }}</h2>
                <div class="bold-text">{{ settings.bold_text }}</div>
                <div class="text">{{ settings.text }}</div>
                {% if settings.button_text %}
                <a href="{{ settings.button_url }}" class="theme-btn btn-style-two">{{ settings.button_text }}</a>
                {% endif %}
            </div>
        </div>
        <div class="gallery-column">
            <div class="clearfix">
                {% for item in settings.entries %}
                <div class="default-service-item col-md-4 col-sm-6 col-xs-12">
                    <div class="inner-box">
                        <div class="content-box">
                            <div class="content-inner">
                                <div class="content">
                                    <div class="icon-box"><span class="icon {{ item.icon_class }}"></span></div>
                                    <h3><a href="{{ item.url }}">{{ item.title }}</a></h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</section>
<!--End FullWidth Section-->
