{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto p-6">
  <h1 class="text-2xl font-bold mb-2">{{ cat.name }}</h1>
  {% if cat.description %}<p class="text-gray-600 mb-4">{{ cat.description }}</p>{% endif %}
  {% if cat.children %}
  <h2 class="font-bold mt-6 mb-2">زیر‌دسته‌ها</h2>
  <ul class="list-disc pr-6">
    {% for ch in cat.children %}
    <li><a href="/category/{{ ch.slug }}" class="text-indigo-600 hover:underline">{{ ch.name }}</a></li>
    {% endfor %}
  </ul>
  {% endif %}
</div>
{% if schema_json %}<script type="application/ld+json">{{ schema_json|safe }}</script>{% endif %}
{% endblock %}
